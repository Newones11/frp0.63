name: build-only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Make All
        run: |
          ./package.sh

      - name: Upload zip packages
        uses: actions/upload-artifact@v4
        with:
          name: frp-packages-zip
          path: release/packages/*.zip

      - name: Upload tar.gz packages
        uses: actions/upload-artifact@v4
        with:
          name: frp-packages-tar-gz
          path: release/packages/*.tar.gz
